<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <!-- Random Fact Section -->
    <section id="fact-box" class="fact-box"></section>

    <!-- Date Pickers and Button -->
    <div class="filters">
  <input type="date" id="startDate" />
  <input type="date" id="endDate" />
  <button id="getImageBtn">Get Space Images</button>
  <button id="resetBtn" class="reset">Reset</button>
</div>


    <!-- Gallery -->
    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Choose your date range and click “Get Space Images” to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <img id="modalImage" src="" alt="">
      <iframe id="modalVideo" src="" frameborder="0" allowfullscreen></iframe>
      <h2 id="modalTitle"></h2>
      <p id="modalDate"></p>
      <p id="modalExplanation"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
